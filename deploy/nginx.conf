# nginx site for Intrusion on one small server.
#   play-intrusion.us         -> the built frontend (static files)
#   server.play-intrusion.us  -> the Colyseus game server on port 2567
# This file is plain HTTP. `certbot --nginx` (see docs/DEPLOY.md) adds HTTPS to both.

server {
    listen 80;
    server_name play-intrusion.us www.play-intrusion.us;
    root /var/www/intrusion;
    index index.html;

    # Art, video and music are kept by the browser, which asks each visit whether they changed
    # (a tiny "not modified" reply). New art under an old file name must never be a week late.
    location /assets/ {
        add_header Cache-Control "no-cache";
    }
    location / {
        try_files $uri /index.html;
    }
}

server {
    listen 80;
    server_name server.play-intrusion.us;

    location / {
        proxy_pass http://127.0.0.1:2567;
        proxy_http_version 1.1;
        # WebSockets: pass the upgrade through and don't cut quiet connections.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
